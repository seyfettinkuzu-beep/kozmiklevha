name: Videoyu indir
on:
  push:
    branches: [main]
    paths: ['.github/video.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null
      - name: İndir ve web için dönüştür
        run: |
          mkdir -p public/video
          url=$(grep -v '^#' .github/video.txt | head -1)
          curl -fsSL -A "KozmikLevha/1.0 (https://github.com/seyfettinkuzu-beep/kozmiklevha)" "$url" -o /tmp/src.webm
          ffprobe -v error -show_entries format=duration -of csv=p=0 /tmp/src.webm
          # sessiz, 1600px, H.264 (her tarayıcıda oynar) + VP9 webm (daha küçük)
          ffmpeg -y -v error -i /tmp/src.webm -an -vf "scale=1600:-2,fps=30" -c:v libx264 -preset slow -crf 27 -pix_fmt yuv420p -movflags +faststart public/video/webb-pillars.mp4
          ffmpeg -y -v error -i /tmp/src.webm -an -vf "scale=1600:-2,fps=30" -c:v libvpx-vp9 -b:v 0 -crf 38 -row-mt 1 public/video/webb-pillars.webm
          ffmpeg -y -v error -i /tmp/src.webm -vf "scale=1600:-2" -frames:v 1 -q:v 3 public/video/webb-pillars-poster.jpg
          ls -la public/video
      - name: Kaydet
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add public/video
          git diff --cached --quiet || git commit -m "Manşet videosu eklendi (NASA SVS, kamu malı)"
          git push
