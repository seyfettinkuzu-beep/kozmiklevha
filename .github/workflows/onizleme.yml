name: Önizleme derlemesi
on:
  push:
    branches: [onizleme]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: |
          cd dist
          git init -q -b onizleme-dist
          git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm dist
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" onizleme-dist
