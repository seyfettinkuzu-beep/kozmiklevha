name: Video adaylarını önizle
on:
  push:
    branches: [main]
    paths: ['.github/video-candidates.txt']
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg imagemagick >/dev/null
      - run: |
          mkdir -p .previews && rm -f .previews/*
          grep -v '^#' .github/video-candidates.txt | while IFS='|' read -r name url; do
            curl -fsSL -A "KozmikLevha/1.0 (https://github.com/seyfettinkuzu-beep/kozmiklevha)" "$url" -o "/tmp/$name.webm" || continue
            d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "/tmp/$name.webm")
            for f in 0.05 0.35 0.65 0.95; do
              t=$(python3 -c "print(round($d*$f,2))")
              ffmpeg -y -v error -ss "$t" -i "/tmp/$name.webm" -frames:v 1 -vf scale=480:-2 "/tmp/${name}_$f.jpg"
            done
            montage /tmp/${name}_*.jpg -tile 4x1 -geometry +4+4 -title "$name  (${d%.*}s)" ".previews/$name.jpg"
          done
          ls -la .previews
      - run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add .previews && git commit -m "Video aday önizlemeleri" && git push
